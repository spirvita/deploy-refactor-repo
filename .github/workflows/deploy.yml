name: Backend Deployment
on:
  push:
    branches:
      - develop
  workflow_dispatch: {}

jobs:
  deployment:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Execute remote SSH commands using password
        uses: appleboy/ssh-action@v1
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_DATABASE_TEST: ${{ secrets.DB_DATABASE_TEST }}
        with:
          key: ${{ secrets.DEPLOY_EC2_SSH_PRIVATE_KEY }}
          username: ${{ secrets.USERNAME }}
          host: ${{ secrets.DEPLOY_EC2_HOST}}
          port: ${{ secrets.EC2_PORT }}
          envs: DB_HOST,DB_PORT,DB_USERNAME,DB_PASSWORD,DB_DATABASE_TEST
          script: |
            cd ~/work/github/shuttler-backend
            git pull
            export PGPASSWORD=${DB_PASSWORD}

            check_db_exists() {
              local dbname="$1"
              if psql -h ${DB_HOST} -p ${DB_PORT} -U ${DB_USERNAME} -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = '${dbname}';" | grep -q 1; then
                echo "資料庫 ${dbname} 已存在"
              else
                echo "資料庫 ${dbname} 不存在"
              fi
            }
          
            echo "🔍 檢查目前 PM2 執行中的應用列表..."
            docker exec -i demo-backend-amd64 /pnpm/pm2 list

            echo "� 開始檢查資料庫狀態..."
            check_db_exists "${DB_DATABASE_TEST}"

            echo "資料庫 migration..."
            docker exec -i demo-backend-amd64 pnpm migration:run

            echo "📦 開始安裝 PNPM 相依套件..."
            docker exec -i demo-backend-amd64 /usr/local/bin/pnpm install
            echo "✅ PNPM 相依套件安裝完成。"

            echo "🟢 重啟 PM2 中名為 api 的應用..."
            docker exec -i demo-backend-amd64 /pnpm/pm2 restart api
            echo "🚀 Deploy complete"